spring:
  application:
    name: MoneyManagement

  # NOTE: no "profiles.active" here on purpose.
  # The active profile is set ONLY via the SPRING_PROFILES_ACTIVE env var
  # at each stage (local / test / docker / prod). Never hardcode it here.

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:MoneyManagement}?
      useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}


  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${BREVO_LOGIN:}
    password: ${BREVO_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          from: ${BREVO_MAIL:}
server:
  port: ${SERVER_PORT:8080}

money:
  manager:
    frontend:
      url: http://localhost:5173


app:
  activation:
    url: ${MONEY_MANAGER_BACKEND_URL:}


