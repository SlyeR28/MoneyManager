spring:
  application:
    name: MoneyManagement

  datasource:
    # Single line URL – no line break!
    url: jdbc:mysql://mysql:3306/${DB_NAME:MoneyManagement}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${BREVO_LOGIN:}
    password: ${BREVO_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          from: ${BREVO_MAIL:}

server:
  port: 8009

money:
  manager:
    frontend:
      url: ${FRONTEND_URL:http://localhost:5173}

app:
  activation:
    url: ${MONEY_MANAGER_BACKEND_URL:http://localhost:8009}

# These are top‑level keys (same indentation as "spring" and "server")
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true